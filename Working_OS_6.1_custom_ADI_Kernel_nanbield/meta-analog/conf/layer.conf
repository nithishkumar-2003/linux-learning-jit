# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-analog"
BBFILE_PATTERN_meta-analog = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-analog = "6"

LAYERDEPENDS_meta-analog = "core"
LAYERSERIES_COMPAT_meta-analog = "nanbield"
