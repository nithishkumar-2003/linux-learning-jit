# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-additional_package"
BBFILE_PATTERN_meta-additional_package = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-additional_package = "6"

LAYERDEPENDS_meta-additional_package = "core"
LAYERSERIES_COMPAT_meta-additional_package = "nanbield"
