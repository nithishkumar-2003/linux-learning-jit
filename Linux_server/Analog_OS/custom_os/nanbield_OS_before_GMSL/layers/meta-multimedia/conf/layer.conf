# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-multimedia"
BBFILE_PATTERN_meta-multimedia = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-multimedia = "6"

LAYERDEPENDS_meta-multimedia = "core"
LAYERSERIES_COMPAT_meta-multimedia = "nanbield"
