MACHINE ??= 'imx8mmevk'
DISTRO ?= 'fsl-imx-xwayland'
PACKAGE_CLASSES ?= 'package_rpm'
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
CONF_VERSION = "2"

DL_DIR ?= "${BSPDIR}/downloads/"
ACCEPT_FSL_EULA = "1"

# Switch to Debian packaging and include package-management in the image
PACKAGE_CLASSES = "package_deb"
EXTRA_IMAGE_FEATURES += "package-management"

RM_OLD_IMAGE = "1"
INHERIT += "rm_work"

ENABLE_UART = "1"
ENABLE_SPI_BUS = "1"
ENABLE_I2C = "1"
ENABLE_SPI = "1"

# Needed for camera/MMAL
ENABLE_VCHIQ = "1"
IMAGE_INSTALL:append= " arducam"


EXTRA_IMAGE_FEATURES += "ssh-server-dropbear"

IMAGE_INSTALL:append = " connman connman-client"
IMAGE_INSTALL:append = " dropbear"

IMAGE_INSTALL:append = " \
    git \
    bash \
    coreutils \
    findutils \
    util-linux \
    gcc \
    g++ \
    make \
    binutils \
    pkgconfig \
"

IMAGE_INSTALL:append = " gcc gcc-symlinks g++ g++-symlinks make binutils libc-dev libstdc++-dev"

DISTRO_FEATURES += " opengl"

DISTRO_FEATURES += " bash"
IMAGE_INSTALL:append = " v4l-utils"
IMAGE_INSTALL:append = " i2c-tools"

IMAGE_INSTALL:append = " vim"
IMAGE_INSTALL:append = " nano"
#IMAGE_INSTALL:append = " vi"
IMAGE_INSTALL:append = " apt"
IMAGE_INSTALL:append = " net-tools"
IMAGE_INSTALL:append = " gnupg"
IMAGE_INSTALL:append = " iproute2"
IMAGE_INSTALL:append = " sudo"
IMAGE_INSTALL:append = " curl"
IMAGE_INSTALL:append = " wget"
IMAGE_INSTALL:append = " ca-certificates"
IMAGE_INSTALL:append = " bash"


IMAGE_INSTALL:append = " python3"
IMAGE_INSTALL:append = " python3-core"
IMAGE_INSTALL:append = " python3-pip"
IMAGE_INSTALL:append = " python3-setuptools"
IMAGE_INSTALL:append = " python3-wheel"
IMAGE_INSTALL:append = " python3-requests"
IMAGE_INSTALL:append = " python3-json"
IMAGE_INSTALL:append = " python3-logging"
IMAGE_INSTALL:append = " python3-urllib3"
IMAGE_INSTALL:append = " python3-pyserial"
IMAGE_INSTALL:append = " python3-spidev"

IMAGE_INSTALL:append = " gcc"
IMAGE_INSTALL:append = " gcc-dev"
IMAGE_INSTALL:append = " libgcc"
IMAGE_INSTALL:append = " libstdc++-dev"

IMAGE_INSTALL:append = " spidev-test"
IMAGE_INSTALL:append = " libserialport"

IMAGE_INSTALL:append = " libgpiod"
IMAGE_INSTALL:append = " libgpiod-dev"
IMAGE_INSTALL:append = " libgpiod-tools"
IMAGE_INSTALL:append = " python3-grpcio"
IMAGE_INSTALL:append = " python3-libconf"
IMAGE_INSTALL:append = " python3-pid"
IMAGE_INSTALL:append = " python3-arpeggio"


DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"


IMAGE_INSTALL:append = " calculator"
IMAGE_INSTALL:append = " welcome"
IMAGE_INSTALL:append = " arducam"

IMAGE_INSTALL:append = " v4l-utils"
IMAGE_INSTALL:append = " ffmpeg"
IMAGE_INSTALL:append = " x264"
PACKAGECONFIG:append:pn-ffmpeg = " x264"
LICENSE_FLAGS_ACCEPTED += "commercial"
IMAGE_INSTALL:append = " libmad"
IMAGE_INSTALL:append = " libmodplug"
IMAGE_INSTALL:append = " libopus"
IMAGE_INSTALL:append = " libopusenc"
IMAGE_INSTALL:append = " libass"
IMAGE_INSTALL:append = " libid3tag"
IMAGE_INSTALL:append = " pulseaudio"

IMAGE_INSTALL:append = " feh"
IMAGE_INSTALL:append = " pcmanfm"


EXTRA_FFCONF += "--enable-gpl"


