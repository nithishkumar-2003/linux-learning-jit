IMAGE_INSTALL_append = " \
    alsa-utils \
    pulseaudio \
    v4l-utils \
    firmware-imx \
    firmware-imx-boot \
    brcmfmac-firmware \
    bluez5 \
    wpa-supplicant \
    usbutils \
    "



# -------------------------------------------------
# MACHINE & DISTRO CONFIGURATION
# -------------------------------------------------
MACHINE ??= 'imx8mmevk'
DISTRO ?= 'fsl-imx-xwayland'
PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
CONF_VERSION = "2"
PACKAGE_CLASSES = "package_deb"
ACCEPT_FSL_EULA = "1"

# -------------------------------------------------
# DEBUGGING, IMAGE FEATURES, AND DISK MONITORING
# -------------------------------------------------
EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
EXTRA_IMAGE_FEATURES += "package-management ssh-server-dropbear"
USER_CLASSES ?= "buildstats"
PATCHRESOLVE = "noop"
RM_OLD_IMAGE = "1"
INHERIT += "rm_work"

BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

DL_DIR ?= "${BSPDIR}/downloads/"

# -------------------------------------------------
# SYSTEM ENABLE FEATURES (UART, SPI, I2C, VCHIQ)
# -------------------------------------------------
ENABLE_UART = "1"
ENABLE_SPI_BUS = "1"
ENABLE_I2C = "1"
ENABLE_SPI = "1"
ENABLE_VCHIQ = "1"

# -------------------------------------------------
# NETWORK AND SSH TOOLS
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    connman \
    connman-client \
    net-tools \
    iproute2 \
    curl \
    wget \
    gnupg \
    ca-certificates \
    sudo \
"

# -------------------------------------------------
# BASE UTILITIES AND TERMINALS
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    bash \
    coreutils \
    findutils \
    util-linux \
    vim \
    nano \
    git \
"

# -------------------------------------------------
# CAMERA / SPI / I2C UTILITIES
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    arducam \
    v4l-utils \
    i2c-tools \
    spidev-test \
    libserialport \
    libgpiod \
    libgpiod-dev \
    libgpiod-tools \
"

# -------------------------------------------------
# PYTHON AND PYTHON MODULES
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    python3 \
    python3-core \
    python3-pip \
    python3-setuptools \
    python3-wheel \
    python3-requests \
    python3-json \
    python3-logging \
    python3-urllib3 \
    python3-pyserial \
    python3-spidev \
    python3-grpcio \
    python3-libconf \
    python3-pid \
    python3-arpeggio \
"

# -------------------------------------------------
# C/C++ DEVELOPMENT TOOLS
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    gcc \
    gcc-dev \
    gcc-symlinks \
    g++ \
    g++-symlinks \
    make \
    binutils \
    libc-dev \
    libstdc++-dev \
    libgcc \
    pkgconfig \
"

# -------------------------------------------------
# MULTIMEDIA AND VIDEO CODECS
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    ffmpeg \
    x264 \
    libmad \
    libmodplug \
    libopus \
    libopusenc \
    libass \
    libid3tag \
    pulseaudio \
"
PACKAGECONFIG:append:pn-ffmpeg = " x264"
LICENSE_FLAGS_ACCEPTED += "commercial"
EXTRA_FFCONF += "--enable-gpl"

# -------------------------------------------------
# DESKTOP UTILITIES AND GUI TOOLS
# -------------------------------------------------
IMAGE_INSTALL:append = " feh"

# -------------------------------------------------
# CUSTOM/USER APPLICATIONS
# -------------------------------------------------
IMAGE_INSTALL:append = " \
    calculator \
    welcome \
"

# -------------------------------------------------
# SYSTEMD ENABLEMENT
# -------------------------------------------------
DISTRO_FEATURES:append = " systemd bash opengl"
VIRTUAL-RUNTIME_init_manager = "systemd"


##############################################################################################################

UUU_BOOTLOADER_UNTAGGED = "imx-boot-sd.bin"


IMAGE_INSTALL:append = " iw wireless-tools"

IMAGE_INSTALL:append = " weston wayland-utils"


IMAGE_INSTALL:append = " \
    alsa-utils \
    bluez5 \
    wpa-supplicant \
    usbutils \
    "




 















