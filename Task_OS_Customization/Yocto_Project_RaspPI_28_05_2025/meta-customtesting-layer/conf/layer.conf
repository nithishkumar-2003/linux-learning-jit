# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-customtesting-layer"
BBFILE_PATTERN_meta-customtesting-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-customtesting-layer = "6"

LAYERDEPENDS_meta-customtesting-layer = "core"
LAYERSERIES_COMPAT_meta-customtesting-layer = "kirkstone"
