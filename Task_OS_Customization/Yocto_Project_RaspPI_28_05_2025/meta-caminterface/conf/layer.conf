# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-caminterface"
BBFILE_PATTERN_meta-caminterface = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-caminterface = "6"

LAYERDEPENDS_meta-caminterface = "core"
LAYERSERIES_COMPAT_meta-caminterface = "kirkstone"
